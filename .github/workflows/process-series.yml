name: Assemblage des prises (Supabase -> galerie)
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/process-series.yml']
  repository_dispatch:
    types: [serie]
  workflow_dispatch:
    inputs:
      only:
        description: 'Nom d une série précise (optionnel)'
        required: false
      force:
        description: 'Retraiter cette série même si déjà publiée'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: process-series
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Outils
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -q opencv-python-headless numpy scipy requests
          # appariement appris (DISK + LightGlue, CPU) pour le recalage des détails dans leur lame d'ensemble ; facultatif
          pip install -q torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu && pip install -q "git+https://github.com/cvg/LightGlue.git" || echo "::warning::LightGlue non installé, recalage SIFT seul"
      - name: Traiter les séries en attente
        id: run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: |
          ONLY="${{ inputs.only || github.event.client_payload.only || '' }}"
          FORCE="${{ (inputs.force || github.event.client_payload.force) && '--force' || '' }}"
          FETCH="${{ github.event.client_payload.fetch_only && '--fetch-only' || '' }}"
          export PIPELINE_ARGS="${{ github.event.client_payload.pipeline_args || '' }}"
          python tools/process_inbox.py ${ONLY:+--only "$ONLY"} $FORCE $FETCH
      - name: Conserver la prise brute (diagnostic, client_payload.keep_raw)
        if: always() && github.event.client_payload.keep_raw && github.event.client_payload.only
        uses: actions/upload-artifact@v4
        with:
          name: brut-${{ github.event.client_payload.only }}
          path: |
            inbox/${{ github.event.client_payload.only }}/video.*
            inbox/${{ github.event.client_payload.only }}/serie.json
            inbox/${{ github.event.client_payload.only }}/journal-telephone.txt
            inbox/${{ github.event.client_payload.only }}/photos
          retention-days: 3
          if-no-files-found: ignore
      - name: Publier dans la galerie (reste éventuel)
        if: always()
        run: |
          git config user.name scanlame && git config user.email scanlame@users.noreply.github.com
          git add lames
          git diff --cached --quiet && exit 0
          git commit -m "Lames : ${{ steps.run.outputs.published }}"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
