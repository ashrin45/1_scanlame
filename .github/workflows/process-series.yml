name: Assemblage des prises (Supabase -> galerie)
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/process-series.yml']
  repository_dispatch:
    types: [serie]
  workflow_dispatch:
    inputs:
      only:
        description: 'Nom d une série précise (optionnel)'
        required: false
      force:
        description: 'Retraiter cette série même si déjà publiée'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: process-series
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Outils
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -q opencv-python-headless numpy scipy requests
      - name: Traiter les séries en attente
        id: run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ONLY="${{ inputs.only || github.event.client_payload.only || '' }}"
          FORCE="${{ (inputs.force || github.event.client_payload.force) && '--force' || '' }}"
          python tools/process_inbox.py ${ONLY:+--only "$ONLY"} $FORCE
      - name: Publier dans la galerie
        if: steps.run.outputs.published != ''
        run: |
          git config user.name scanlame && git config user.email scanlame@users.noreply.github.com
          git add lames
          git commit -m "Lames : ${{ steps.run.outputs.published }}"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
