name: Déploiement du Space Hugging Face
on:
  push:
    branches: [main]
    paths: ['space/**', 'tools/**', 'index.html', '.github/workflows/deploy-space.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assembler le contenu du Space
        run: |
          mkdir stage
          cp space/Dockerfile space/app.py space/README.md stage/
          cp -r tools stage/tools
          cp index.html stage/index.html
      - name: Pousser vers Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN" -a -n "$HF_SPACE" || { echo "Secrets HF_TOKEN / HF_SPACE manquants"; exit 1; }
          cd stage
          git init -q -b main
          git config user.name scanlame && git config user.email scanlame@users.noreply.github.com
          git add -A && git commit -q -m "Déploiement ${GITHUB_SHA::8}"
          git push -q --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
