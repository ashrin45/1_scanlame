name: Images entières des lames (release « lames »)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q opencv-python-headless numpy requests
      - name: Reconstruire chaque lame depuis ses tuiles et la déposer dans la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view lames -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create lames -R "$GITHUB_REPOSITORY" --title "Lames entières (JPEG pleine résolution)" --notes "Une image par lame, nommée <slug>.jpg, remplacée à chaque réassemblage ou rognage." --latest=false
          for d in lames/*/; do
            s=$(basename "$d"); [ -f "lames/$s/lame.json" ] || continue
            python tools/telecharger_lame.py "$s" --local -o "/tmp/$s.jpg" && gh release upload lames "/tmp/$s.jpg" -R "$GITHUB_REPOSITORY" --clobber && rm -f "/tmp/$s.jpg"
          done
