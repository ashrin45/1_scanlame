<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test local</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen viewer, slim instrument bar on top, the slide fills the rest */
:root {
  --bg: #f3f0f4; --panel: #ffffff; --fg: #2b2433; --muted: #6e6478; --line: #d9d2de;
  --accent: #7a2e8c; --accent-soft: rgba(122,46,140,.14); --stage: #e9e4ec;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17131b; --panel: #211c26; --fg: #ece6f0; --muted: #a79cb1; --line: #3a323f;
  --accent: #c58ad6; --accent-soft: rgba(197,138,214,.18); --stage: #0f0c12; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #17131b; --panel: #211c26; --fg: #ece6f0; --muted: #a79cb1; --line: #3a323f;
  --accent: #c58ad6; --accent-soft: rgba(197,138,214,.18); --stage: #0f0c12; color-scheme: dark }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); display: flex; flex-direction: column; overflow: hidden; }
header { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line); }
h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .01em; }
.meta { font-family: var(--font-data); font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.meta b { color: var(--fg); font-weight: 500; }
.tools { margin-left: auto; display: flex; gap: 6px; }
button { font: 500 13px var(--font-ui); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; min-width: 36px; }
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
#viewer { flex: 1 1 auto; min-height: 0; background: var(--stage); position: relative; }
#viewer .navigator { border: 1px solid var(--line) !important; background: var(--panel) !important; }
.hud { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); z-index: 5;
  font-family: var(--font-data); font-size: 12px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; pointer-events: none; font-variant-numeric: tabular-nums; }
svg.fields polygon { fill: none; stroke: var(--accent); stroke-width: 1.5px; vector-effect: non-scaling-stroke; opacity: .9; }
svg.fields text { fill: var(--accent); font: 500 70px var(--font-data); paint-order: stroke; stroke: var(--panel); stroke-width: 18px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>Test local</h1>
  <div class="meta"><span><b>20</b> champs</span><span><b>6816 × 3174</b> px</span><span><b>14</b> niveaux de zoom</span><span>échelle non calibrée</span></div>
  <div class="tools">
    <button id="zin" aria-label="Zoom avant">+</button>
    <button id="zout" aria-label="Zoom arrière">−</button>
    <button id="home" aria-label="Vue entière">⌂</button>
    <button id="fields" aria-pressed="false">Champs</button>
  </div>
</header>
<div id="viewer"><div class="hud" id="hud">zoom 1.00×</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
<script>
const W = 6816, H = 3174;
const FIELDS = [{"id":"0000","pts":[[1147,250],[4085,0],[4334,2923],[1396,3174]],"scale":0.525},{"id":"0008","pts":[[3621,190],[5553,136],[5619,2509],[3688,2563]],"scale":1.0},{"id":"0013","pts":[[1803,169],[3773,165],[3778,2583],[1808,2587]],"scale":0.981},{"id":"0019","pts":[[58,149],[2014,196],[1956,2615],[0,2568]],"scale":0.987},{"id":"0018","pts":[[77,146],[2031,193],[1974,2617],[20,2570]],"scale":0.989},{"id":"0017","pts":[[1167,154],[3130,173],[3107,2585],[1144,2567]],"scale":0.984},{"id":"0016","pts":[[1297,166],[3262,179],[3247,2588],[1282,2575]],"scale":0.983},{"id":"0015","pts":[[1544,170],[3511,174],[3506,2587],[1539,2582]],"scale":0.982},{"id":"0014","pts":[[1645,172],[3613,172],[3613,2586],[1645,2586]],"scale":0.981},{"id":"0012","pts":[[2058,170],[4025,158],[4039,2576],[2073,2587]],"scale":0.982},{"id":"0011","pts":[[2365,174],[4330,155],[4352,2569],[2388,2587]],"scale":0.984},{"id":"0010","pts":[[2727,183],[4679,154],[4715,2553],[2763,2582]],"scale":0.989},{"id":"0009","pts":[[3296,185],[5238,139],[5294,2525],[3352,2571]],"scale":0.994},{"id":"0007","pts":[[3932,182],[5875,107],[5967,2495],[4024,2570]],"scale":0.994},{"id":"0006","pts":[[4076,175],[6020,97],[6115,2487],[4171,2564]],"scale":0.993},{"id":"0005","pts":[[4256,152],[6214,78],[6304,2484],[4346,2558]],"scale":0.986},{"id":"0004","pts":[[4627,162],[6566,59],[6693,2444],[4753,2547]],"scale":0.995},{"id":"0003","pts":[[4643,164],[6583,60],[6710,2447],[4771,2551]],"scale":0.995},{"id":"0002","pts":[[4700,156],[6643,53],[6770,2446],[4827,2549]],"scale":0.993},{"id":"0001","pts":[[4744,143],[6695,45],[6815,2448],[4865,2546]],"scale":0.989}];
const viewer = OpenSeadragon({
  id: 'viewer', showNavigationControl: false, showNavigator: true, navigatorPosition: 'TOP_RIGHT', navigatorSizeRatio: 0.16,
  gestureSettingsTouch: { pinchToZoom: true, flickEnabled: true }, maxZoomPixelRatio: 3, minZoomImageRatio: 0.6, visibilityRatio: 0.5,
  animationTime: 0.6, immediateRender: true, preserveViewport: false,
  tileSources: { Image: { xmlns: 'http://schemas.microsoft.com/deepzoom/2008', Url: 'lame_files/', Format: 'jpg', Overlap: '1', TileSize: '512', Size: { Width: String(W), Height: String(H) } } }
});
document.getElementById('zin').onclick = () => viewer.viewport.zoomBy(1.6);
document.getElementById('zout').onclick = () => viewer.viewport.zoomBy(1 / 1.6);
document.getElementById('home').onclick = () => viewer.viewport.goHome();
// field outlines: one SVG overlay in image pixel coordinates
const svgNS = 'http://www.w3.org/2000/svg';
const svg = document.createElementNS(svgNS, 'svg');
svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('class', 'fields'); svg.setAttribute('width', '100%'); svg.setAttribute('height', '100%');
svg.style.overflow = 'visible';
for (const f of FIELDS) {
  const p = document.createElementNS(svgNS, 'polygon');
  p.setAttribute('points', f.pts.map(q => q.join(',')).join(' '));
  svg.appendChild(p);
  const t = document.createElementNS(svgNS, 'text');
  const [x, y] = f.pts[0]; t.setAttribute('x', x + 40); t.setAttribute('y', y + 110); t.textContent = f.id; svg.appendChild(t);
}
svg.hidden = true;
viewer.addHandler('open', () => {
  viewer.addOverlay({ element: svg, location: new OpenSeadragon.Rect(0, 0, 1, H / W) });
});
const btn = document.getElementById('fields');
btn.onclick = () => { const on = btn.getAttribute('aria-pressed') !== 'true'; btn.setAttribute('aria-pressed', String(on)); svg.hidden = !on; };
const hud = document.getElementById('hud');
viewer.addHandler('zoom', () => {
  const z = viewer.viewport.viewportToImageZoom(viewer.viewport.getZoom(true));
  hud.textContent = 'zoom ' + z.toFixed(2) + '× (1,00× = pixels natifs)';
});
</script>

</body>
</html>
