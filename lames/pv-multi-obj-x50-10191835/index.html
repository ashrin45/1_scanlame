  viewer.addHandler('open', () => viewer.addTiledImage({
    tileSource: { width: c.width, height: c.height, tileSize: c.tile, tileOverlap: 1, minLevel: 0, maxLevel: c.maxlvl, getTileUrl: (l, x, y) => `../${c.slug}/lame_files/${l}/${x}_${y}.jpg` },
    x: tx / W, y: ty / W, width: s * c.width / W, degrees: deg,
    success: e => { kidLayers.push(e.item); if (c.outline && c.outline.length && e.item.setCroppingPolygons) e.item.setCroppingPolygons(c.outline.map(poly => poly.map(([x, y]) => ({ x, y })))); }   // fond blanc hors couverture rogné
  }));
}
if (placed.length) {
  $('kids').hidden = false;
  let on = true;
  const apply = () => { kidLayers.forEach(l => l.setOpacity(on ? 1 : 0)); if (on) viewer.addOverlay({ element: kidSvg, location: new OpenSeadragon.Rect(0, 0, 1, H / W) }); else viewer.removeOverlay(kidSvg); };
  $('kids').onclick = () => { on = !on; $('kids').setAttribute('aria-pressed', String(on)); apply(); };
  viewer.addHandler('open', () => viewer.addOverlay({ element: kidSvg, location: new OpenSeadragon.Rect(0, 0, 1, H / W) }));
}

// ---- contours des champs (sur demande) ----
const svg = document.createElementNS(svgNS, 'svg');
svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('class', 'fields'); svg.setAttribute('width', '100%'); svg.setAttribute('height', '100%');
svg.style.overflow = 'visible';
for (const f of FIELDS) {
  const p = document.createElementNS(svgNS, 'polygon');
  p.setAttribute('points', f.pts.map(q => q.join(',')).join(' '));
  svg.appendChild(p);
  const t = document.createElementNS(svgNS, 'text');
  const [x, y] = f.pts[0]; t.setAttribute('x', x + 40); t.setAttribute('y', y + 110); t.textContent = f.id + (f.z ? ' z' : ''); svg.appendChild(t);
}
let fieldsShown = false;
$('fields').onclick = () => { fieldsShown = !fieldsShown; $('fields').setAttribute('aria-pressed', String(fieldsShown)); if (fieldsShown) viewer.addOverlay({ element: svg, location: new OpenSeadragon.Rect(0, 0, 1, H / W) }); else viewer.removeOverlay(svg); };

// ---- rapport de qualité : panneau + calque (netteté par champ, trous) ----
if (QUALITY && QUALITY.grade) {
  $('qbtn').hidden = false; $('qg').textContent = QUALITY.grade; $('qg').className = 'g g' + QUALITY.grade;
  const qsvg = document.createElementNS(svgNS, 'svg');
  qsvg.setAttribute('viewBox', `0 0 ${W} ${H}`); qsvg.setAttribute('class', 'quality'); qsvg.setAttribute('width', '100%'); qsvg.setAttribute('height', '100%'); qsvg.style.overflow = 'visible';
  for (const f of FIELDS) {
    const p = document.createElementNS(svgNS, 'polygon');
    p.setAttribute('points', f.pts.map(q => q.join(',')).join(' '));
    const s = f.sharp == null ? 1 : f.sharp;
    p.setAttribute('class', (s >= 0.8 ? 's2' : s >= 0.5 ? 's1' : 's0') + (f.tracked ? ' tracked' : ''));
    qsvg.appendChild(p);
  }
  for (const h of QUALITY.holes || []) {
    const p = document.createElementNS(svgNS, 'polygon'); p.setAttribute('points', h.map(q => q.join(',')).join(' ')); p.setAttribute('class', 'hole'); qsvg.appendChild(p);
  }
  const fr = QUALITY.frames || {};
  const fmt = v => v == null ? '' : (typeof v === 'number' ? v.toLocaleString('fr-FR') : v);
  $('qpanel').innerHTML = `<h2>Qualité <span class="g g${QUALITY.grade}" style="padding:0 6px;border-radius:4px;color:#fff">${QUALITY.grade}</span></h2>` +
    (QUALITY.notes && QUALITY.notes.length ? '<ul>' + QUALITY.notes.map(n => `<li>${n}</li>`).join('') + '</ul>' : '<p style="margin:0 0 8px">Aucune remarque : couverture continue, champs nets, recalage précis.</p>') +
    `<div class="kv"><span>images extraites</span><span>${fmt(fr.candidates)}</span><span>floues rejetées</span><span>${fmt(fr.blurred)}</span><span>champs assemblés</span><span>${fmt(fr.used)} / ${fmt(fr.selected)}</span>` +
    `<span>recalage médian</span><span>${fmt(QUALITY.residual_px)} px</span><span>surface couverte</span><span>${QUALITY.coverage_mm2 != null ? fmt(QUALITY.coverage_mm2) + ' mm²' : fmt(QUALITY.coverage_px) + ' px'}</span>` +
    `<span>flat-field</span><span>${fmt(QUALITY.flat_field)}</span>${QUALITY.zstack_fields ? `<span>piles de profondeur</span><span>${QUALITY.zstack_fields} (${QUALITY.zstack_levels} plans)</span>` : ''}</div>` +
    `<div class="leg"><span><i style="background:rgba(27,148,102,.5)"></i>net</span><span><i style="background:rgba(183,121,31,.6)"></i>moyen</span><span><i style="background:rgba(192,57,43,.6)"></i>peu net</span><span><i style="border:2px dashed #c0392b;box-sizing:border-box"></i>trou</span><span><i style="border:1px dashed #666;box-sizing:border-box"></i>placé sans recalage</span></div>`;
  let qOn = false;
  $('qbtn').onclick = () => { qOn = !qOn; $('qbtn').setAttribute('aria-pressed', String(qOn)); $('qpanel').hidden = !qOn; if (qOn) viewer.addOverlay({ element: qsvg, location: new OpenSeadragon.Rect(0, 0, 1, H / W) }); else viewer.removeOverlay(qsvg); };
}

// ---- z-stack : un calque par plan, seul le plan choisi est visible (la base EDF reste dessous) ----
if (ZSTACK && ZSTACK.levels > 0) {
  const keys = new Set(ZSTACK.tiles || []);
  const layers = [];
  viewer.addHandler('open', () => {
    for (let z = 0; z < ZSTACK.levels; z++) viewer.addTiledImage({ tileSource: source('lame_z' + z, keys), opacity: 0, success: e => { layers[z] = e.item; } });
  });
  $('zctl').hidden = false; $('zr').max = ZSTACK.levels;
  const setZ = v => {
    v = Math.max(0, Math.min(ZSTACK.levels, v)); $('zr').value = v;
    $('zl').textContent = v === 0 ? 'net partout' : `plan ${v} / ${ZSTACK.levels}`;
    layers.forEach((l, z) => l && l.setOpacity(z === v - 1 ? 1 : 0));
  };
  $('zr').oninput = () => setZ(+$('zr').value);
  document.addEventListener('keydown', e => { if (e.key === '[') setZ(+$('zr').value - 1); if (e.key === ']') setZ(+$('zr').value + 1); });
}

// ---- zoom + barre d'échelle ----
const hud = $('hud'), bar = $('bar');
function updateBar() {
  if (!UMPX) return;
  const z = imgZoom();   // pixels écran par pixel image
  const umPerScreenPx = UMPX / z;
  const target = 120 * umPerScreenPx;
  const p = Math.pow(10, Math.floor(Math.log10(target)));
  const len = [1, 2, 5, 10].map(m => m * p).reduce((a, b) => Math.abs(b - target) < Math.abs(a - target) ? b : a);
  bar.querySelector('i').style.width = (len / umPerScreenPx).toFixed(1) + 'px';
  bar.querySelector('span').textContent = len >= 1000 ? (len / 1000).toLocaleString('fr-FR') + ' mm' : len.toLocaleString('fr-FR') + ' µm';
  bar.hidden = false;
}
const imgZoom = () => { const it = viewer.world.getItemAt(0); return it ? it.viewportToImageZoom(viewer.viewport.getZoom(true)) : viewer.viewport.getZoom(true) / W; };
function updateHud() {
  const z = imgZoom();
  hud.textContent = 'zoom ' + z.toFixed(2) + '× (1,00× = pixels natifs)';
  updateBar();
}
viewer.addHandler('zoom', updateHud);
viewer.addHandler('animation', updateHud);
viewer.addHandler('animation-finish', updateHud);
viewer.addHandler('open', updateHud);
</script>
</body>
</html>
