<script>

const placed = CHILDREN.filter(c => c.transform);
const unplaced = CHILDREN.filter(c => !c.transform);
if (CHILDREN.length) {
  $('info').insertAdjacentHTML('beforeend', ($('info').textContent ? ' · ' : '') + CHILDREN.map(c => `<a href="../${c.slug}/">↗ ${c.title}${c.objective ? ' (obj. ' + c.objective + ')' : ''}</a>`).join(' · '));

  const corners = [[0, 0], [c.width, 0], [c.width, c.height], [0, c.height]].map(([x, y]) => [a * x - b * y + tx, b * x + a * y + ty]);
  const polys = (c.outline && c.outline.length) ? c.outline.map(poly => poly.map(([x, y]) => [a * x - b * y + tx, b * x + a * y + ty])) : [corners];
  for (const poly of polys) { const p = document.createElementNS(svgNS, 'polygon'); p.setAttribute('points', poly.map(q => q.map(v => v.toFixed(1)).join(',')).join(' ')); kidSvg.appendChild(p); }
  const t = document.createElementNS(svgNS, 'text'); t.setAttribute('x', corners[0][0] + 30); t.setAttribute('y', corners[0][1] - 20); t.textContent = c.objective ? 'obj. ' + c.objective : c.title; kidSvg.appendChild(t);
  viewer.addHandler('open', () => viewer.addTiledImage({
    tileSource: { width: c.width, height: c.height, tileSize: c.tile, tileOverlap: 1, minLevel: 0, maxLevel: c.maxlvl, getTileUrl: (l, x, y) => `../${c.slug}/lame_files/${l}/${x}_${y}.jpg` },

    x: (a * c.width / 2 - b * c.height / 2 + tx - s * c.width / 2) / W, y: (b * c.width / 2 + a * c.height / 2 + ty - s * c.height / 2) / W, width: s * c.width / W, degrees: deg,

  }));

}

if (QUALITY && QUALITY.grade) {
  $('qbtn').hidden = false; $('qg').textContent = QUALITY.grade; $('qg').className = 'g g' + QUALITY.grade;
  const qsvg = document.createElementNS(svgNS, 'svg');

  for (const f of FIELDS) {

  const p = Math.pow(10, Math.floor(Math.log10(target)));
  const len = [1, 2, 5, 10].map(m => m * p).reduce((a, b) => Math.abs(b - target) < Math.abs(a - target) ? b : a);
  bar.querySelector('i').style.width = (len / umPerScreenPx).toFixed(1) + 'px';
  bar.querySelector('span').textContent = len >= 1000 ? (len / 1000).toLocaleString('fr-FR') + ' mm' : len.toLocaleString('fr-FR') + ' µm';
  bar.hidden = false;
}
const imgZoom = () => { const it = viewer.world.getItemAt(0); return it ? it.viewportToImageZoom(viewer.viewport.getZoom(true)) : viewer.viewport.getZoom(true) / W; };
function updateHud() {
  const z = imgZoom();
  hud.textContent = 'zoom ' + z.toFixed(2) + '× (1,00× = pixels natifs)';
  updateBar();
}
viewer.addHandler('zoom', updateHud);
viewer.addHandler('animation', updateHud);
viewer.addHandler('animation-finish', updateHud);
viewer.addHandler('open', updateHud);

// ---- modifier la lame : rogner, supprimer (demande envoyee a la fonction Supabase, executee par GitHub Actions) ----
const LS = { get: k => { try { return localStorage.getItem(k) || ''; } catch (_) { return ''; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} } };
$('eurl').value = LS.get('scanlame.url'); $('etoken').value = LS.get('scanlame.token');
$('eurl').onchange = () => LS.set('scanlame.url', $('eurl').value.trim()); $('etoken').onchange = () => LS.set('scanlame.token', $('etoken').value.trim());
$('editbtn').onclick = () => { const on = $('epanel').hidden; $('epanel').hidden = !on; $('editbtn').setAttribute('aria-pressed', on); };
async function sendEdit(payload) {
  const url = $('eurl').value.trim().replace(/\/+$/, ''), token = $('etoken').value.trim();
  if (!url || !token) { $('emsg').textContent = 'URL du serveur et jeton nécessaires (voir la page de capture).'; return false; }
  $('emsg').textContent = 'envoi…';
  try {
    const r = await fetch(url + '/finish', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Token': token },
      body: JSON.stringify({ series: 'edit_' + Date.now(), slug: SLUG, ...payload }) });
    if (!r.ok) { $('emsg').textContent = 'refusé : HTTP ' + r.status; return false; }
    const j = await r.json();
    $('emsg').textContent = 'Demande envoyée' + (j.dispatched ? ' : GitHub Actions est réveillé, ' : ' (traitement au prochain passage, 15 min au plus) : ') + 'rechargez la page dans quelques minutes.';
    return true;
  } catch (e) { $('emsg').textContent = 'erreur : ' + e.message; return false; }
}
$('edelete').onclick = async () => {
  if (!confirm('Supprimer définitivement cette lame de la galerie ?')) return;
  if (await sendEdit({ action: 'delete' })) $('edelete').disabled = true;
};
// rognage : rectangle trace au doigt ou a la souris sur la vue, converti en px de la lame
let crop = null, cropStart = null;
const rectEl = $('croprect');
function imgPt(ev) {
  const r = $('viewer').getBoundingClientRect();
  const p = viewer.world.getItemAt(0).viewerElementToImageCoordinates(new OpenSeadragon.Point(ev.clientX - r.left, ev.clientY - r.top));   // image principale (les calques sont d'autres images)
  return { x: Math.max(0, Math.min(W, p.x)), y: Math.max(0, Math.min(H, p.y)) };
}
function drawCrop() {
  if (!crop) { rectEl.style.display = 'none'; $('cropok').disabled = true; return; }
  const main = viewer.world.getItemAt(0);
  const a = main.imageToViewerElementCoordinates(new OpenSeadragon.Point(crop.x0, crop.y0));
  const b = main.imageToViewerElementCoordinates(new OpenSeadragon.Point(crop.x1, crop.y1));
  rectEl.style.display = 'block'; rectEl.style.left = a.x + 'px'; rectEl.style.top = a.y + 'px'; rectEl.style.width = (b.x - a.x) + 'px'; rectEl.style.height = (b.y - a.y) + 'px';
  const ok = crop.x1 - crop.x0 >= 64 && crop.y1 - crop.y0 >= 64;
  $('cropok').disabled = !ok;
  $('cropinfo').textContent = ok ? `zone gardée : ${Math.round(crop.x1 - crop.x0)} × ${Math.round(crop.y1 - crop.y0)} px` : 'Tracez un rectangle à garder';
}
$('ecrop').onclick = () => {
  $('epanel').hidden = true; $('editbtn').setAttribute('aria-pressed', 'false');
  $('cropper').hidden = false; $('cropbar').hidden = false; crop = null; drawCrop();
  viewer.setMouseNavEnabled(false);
};
const endCrop = () => { $('cropper').hidden = true; $('cropbar').hidden = true; crop = null; drawCrop(); viewer.setMouseNavEnabled(true); };
$('cropcancel').onclick = endCrop;
$('cropper').onpointerdown = ev => { ev.preventDefault(); $('cropper').setPointerCapture(ev.pointerId); cropStart = imgPt(ev); crop = { x0: cropStart.x, y0: cropStart.y, x1: cropStart.x, y1: cropStart.y }; drawCrop(); };
$('cropper').onpointermove = ev => { if (!cropStart) return; const p = imgPt(ev); crop = { x0: Math.min(cropStart.x, p.x), y0: Math.min(cropStart.y, p.y), x1: Math.max(cropStart.x, p.x), y1: Math.max(cropStart.y, p.y) }; drawCrop(); };
$('cropper').onpointerup = $('cropper').onpointercancel = () => { cropStart = null; };
viewer.addHandler('animation', () => { if (crop) drawCrop(); });
$('cropok').onclick = async () => {
  if (!crop) return;
  const rect = [crop.x0, crop.y0, crop.x1, crop.y1].map(Math.round);
  if (!confirm(`Garder seulement la zone ${rect[2] - rect[0]} × ${rect[3] - rect[1]} px et jeter le reste ? (irréversible)`)) return;
  $('epanel').hidden = false;
  if (await sendEdit({ action: 'crop', rect })) endCrop();
};
</script>
